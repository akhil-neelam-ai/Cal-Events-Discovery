name: Update Events Daily

on:
  schedule:
    # GitHub cron is UTC-only, so run at both 11:00 and 12:00 UTC.
    # schedule-gate maps the triggering cron to the active Pacific offset
    # so delayed runs still execute on the intended local 4:00 AM schedule.
    #
    # Fall cadence (2026-08): daily at 4:00 AM Pacific — campus event volume
    # rises with the semester. Summer was Mon/Wed/Fri only.
    - cron: "0 11 * * *"
    - cron: "0 12 * * *"
  workflow_dispatch:

concurrency:
  group: update-events-main
  cancel-in-progress: false

env:
  AUTOMATION_PR_TOKEN: ${{ secrets.AUTOMATION_PR_TOKEN }}

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  schedule-gate:
    if: ${{ github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.gate.outputs.should_run }}
    steps:
      - name: Gate scheduled runs to 4:00 AM Pacific
        id: gate
        run: |
          trigger_cron='${{ github.event.schedule }}'
          pacific_offset="$(TZ=America/Los_Angeles date +%z)"
          should_run=false

          # Match the cron strings configured above. Update both this case
          # and the cron list together when switching summer/fall cadence.
          case "${pacific_offset}:${trigger_cron}" in
            -0700:"0 11 * * *"|\
            -0800:"0 12 * * *")
              should_run=true
              ;;
          esac

          echo "should_run=${should_run}" >> "$GITHUB_OUTPUT"

          if [ "$should_run" != "true" ]; then
            echo "Skipping scheduled run triggered by '${trigger_cron}' with Pacific offset ${pacific_offset}."
          fi

  update-events:
    needs: schedule-gate
    if: |
      always() && (
        github.event_name == 'workflow_dispatch' ||
        (needs.schedule-gate.result == 'success' && needs.schedule-gate.outputs.should_run == 'true')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      # Validate the automation token before spending a pipeline run on it.
      # An expired PAT used to surface only at the create-PR step, as
      # `fatal: could not read Username for 'https://github.com'` — git's
      # credential-prompt message, which names neither the token nor the fix.
      # That cost seven days of stale production data in 2026-08.
      #
      # Sets usable=true only when the token authenticates AND is not
      # definitively read-only. A set-but-broken token degrades to
      # GITHUB_TOKEN rather than losing the day's snapshot entirely; the
      # final step of this job then fails the run so notify-failure alerts.
      - name: Check automation token
        id: token_check
        env:
          GH_TOKEN: ${{ env.AUTOMATION_PR_TOKEN }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          ROTATE_URL: ${{ github.server_url }}/settings/personal-access-tokens
        run: |
          set -uo pipefail

          if [ -z "${AUTOMATION_PR_TOKEN:-}" ]; then
            echo "usable=false" >> "$GITHUB_OUTPUT"
            if [ "${EVENT_NAME}" = "schedule" ]; then
              echo "::error::AUTOMATION_PR_TOKEN is not set — scheduled runs require it. See README → GitHub secrets."
              exit 1
            fi
            echo "::warning::AUTOMATION_PR_TOKEN is not set; the snapshot PR will be opened with GITHUB_TOKEN and will not auto-merge."
            exit 0
          fi

          # Hitting the repo endpoint checks the two things the token must do:
          # authenticate, and reach this repository.
          if ! push_access="$(gh api "repos/${REPO}" --jq '.permissions.push' 2>&1)"; then
            echo "::error::AUTOMATION_PR_TOKEN is set but GitHub rejected it — expired, revoked, or not scoped to ${REPO}. Rotate it at ${ROTATE_URL} and update the AUTOMATION_PR_TOKEN secret."
            echo "gh api reported: ${push_access}"
            echo "usable=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Only a definitive `false` is treated as insufficient. Some token
          # types omit `permissions` entirely; that is not evidence of a
          # problem, so let the real push be the judge.
          if [ "${push_access}" = "false" ]; then
            echo "::error::AUTOMATION_PR_TOKEN authenticates but has no write access to ${REPO}. Grant Contents + Pull requests write, then update the secret."
            echo "usable=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "usable=true" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate events snapshot
        env:
          STRICT_DATA_QUALITY: "true"
          # Must exceed the longest gap between scheduled runs. Daily cadence
          # leaves ~24h between publishes; 48 leaves headroom for a missed run.
          MAX_FALLBACK_AGE_HOURS: "48"
        run: |
          set -euo pipefail
          for attempt in 1 2; do
            if npm run update-events; then
              exit 0
            fi
            if [ "${attempt}" = "2" ]; then
              echo "::error::update-events failed after 2 attempts"
              exit 1
            fi
            echo "update-events failed (attempt ${attempt}), retrying in 120s..."
            sleep 120
          done

      - name: Check feed health
        env:
          BLOCK_ON_DEGRADED: "true"
          FEED_STALE_HOURS: "36"
          MAX_FALLBACK_AGE_HOURS: "48"
        run: npx tsx scripts/checkFeedHealth.ts

      # Publish-critical validation only. Live corpus golden queries
      # (search-quality) must not block shipping a healthy snapshot — they run
      # afterward and open a low-priority data-quality issue on failure.
      - name: Validate published artifacts
        run: npm run validate

      - name: Read topic assignment status
        id: topic_assignment
        run: |
          outcome="$(jq -r '.topics.outcome // "error"' public/status.json)"
          echo "outcome=${outcome}" >> "$GITHUB_OUTPUT"
          if [ "${outcome}" = "error" ]; then
            error="$(jq -r '.topics.error // "unknown assignment error"' public/status.json)"
            echo "::warning::Topic assignment failed. The snapshot was published with carried-forward topics where available: ${error}"
          fi

      - name: Open data-quality issue on topic assignment failure
        if: ${{ steps.topic_assignment.outputs.outcome == 'error' }}
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_NAME: Topic assignment quality
          FAILURE_CONTEXT: topic assignment reported a failure in the newly generated status.json
          ISSUE_LABEL: data-quality
          ISSUE_LABEL_COLOR: FBCA04
          ISSUE_LABEL_DESCRIPTION: Non-blocking corpus/search quality regression for triage
        run: node scripts/notifyPipelineFailure.mjs

      - name: Corpus search-quality checks
        id: search_quality
        continue-on-error: true
        run: npm run test:search-quality

      - name: Open data-quality issue on corpus regressions
        if: ${{ steps.search_quality.outcome == 'failure' }}
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_NAME: Corpus search quality
          FAILURE_CONTEXT: live golden-query checks against the newly generated feed
          ISSUE_LABEL: data-quality
          ISSUE_LABEL_COLOR: FBCA04
          ISSUE_LABEL_DESCRIPTION: Non-blocking corpus/search quality regression for triage
        run: node scripts/notifyPipelineFailure.mjs

      - name: Create artifact update pull request
        id: create_pr
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ steps.token_check.outputs.usable == 'true' && env.AUTOMATION_PR_TOKEN || github.token }}
          branch: automation/update-events
          base: main
          delete-branch: true
          add-paths: |
            public/events.json
            public/search-index.json
            public/status.json
          commit-message: "Update events snapshot"
          title: "Update events snapshot"
          body: |
            ## Summary

            This PR was opened automatically by the daily events pipeline.

            Updated artifacts:

            - `public/events.json`
            - `public/search-index.json`
            - `public/status.json`

            ## Validation

            - `npm run update-events`
            - `npm run validate` (publish-critical; search-quality is non-blocking)
            - Corpus search-quality: `${{ steps.search_quality.outcome }}`

            Workflow run: `${{ github.run_id }}`
          author: github-actions[bot] <github-actions[bot]@users.noreply.github.com>
          committer: github-actions[bot] <github-actions[bot]@users.noreply.github.com>

      - name: Warn if updater PR cannot complete automatically
        if: ${{ steps.create_pr.outputs.pull-request-number && steps.token_check.outputs.usable != 'true' }}
        run: |
          echo "::warning::AUTOMATION_PR_TOKEN is unavailable or unusable."
          echo "::warning::The updater PR was created with GITHUB_TOKEN, so downstream pull_request workflows like browser-e2e will not run and auto-merge is skipped. Merge PR #${{ steps.create_pr.outputs.pull-request-number }} by hand to publish today's snapshot."

      - name: Wait for required checks and merge artifact update PR
        if: ${{ steps.create_pr.outputs.pull-request-number && steps.token_check.outputs.usable == 'true' }}
        # Gate the merge on the data-relevant checks ONLY. The old approach used
        # `gh pr checks --watch --fail-fast`, which failed the whole cron when
        # *any* check went red — including unrelated ones (e.g. a transient
        # security advisory). A daily data refresh must merge whenever the data
        # itself is validated, not when the entire repo posture is perfect.
        env:
          GH_TOKEN: ${{ env.AUTOMATION_PR_TOKEN }}
          # Substring-matched (case-insensitive) against the PR's check names.
          REQUIRED_CHECKS: "validate browser-e2e"
          # Overall budget for required checks to appear and finish.
          CHECK_TIMEOUT_SECONDS: "1200"
          POLL_INTERVAL_SECONDS: "15"
        run: |
          set -euo pipefail
          pr_number="${{ steps.create_pr.outputs.pull-request-number }}"
          deadline=$(( $(date +%s) + CHECK_TIMEOUT_SECONDS ))

          while :; do
            # `gh pr checks --json` prints the JSON array even when its exit code
            # is non-zero (pending/failing), so capture output regardless.
            checks="$(gh pr checks "${pr_number}" --json name,bucket 2>/dev/null || true)"
            checks="${checks:-[]}"

            all_pass=true
            any_fail=false
            for req in ${REQUIRED_CHECKS}; do
              bucket="$(echo "${checks}" | jq -r --arg n "${req}" \
                '[.[] | select((.name | ascii_downcase) | contains($n))] | (.[0].bucket // "missing")')"
              case "${bucket}" in
                pass) ;;
                fail|cancel)
                  any_fail=true
                  echo "::error::Required check '${req}' is ${bucket} on PR #${pr_number}."
                  ;;
                *) all_pass=false ;; # pending, skipping, or not yet registered
              esac
            done

            if [ "${any_fail}" = "true" ]; then
              echo "Required check(s) failed; refusing to merge PR #${pr_number}."
              gh pr checks "${pr_number}" || true
              exit 1
            fi

            if [ "${all_pass}" = "true" ]; then
              echo "All required checks passed for PR #${pr_number}."
              break
            fi

            if [ "$(date +%s)" -ge "${deadline}" ]; then
              echo "::error::Timed out after ${CHECK_TIMEOUT_SECONDS}s waiting for required checks on PR #${pr_number}."
              gh pr checks "${pr_number}" || true
              exit 1
            fi

            sleep "${POLL_INTERVAL_SECONDS}"
          done

          gh pr merge --merge "${pr_number}"

      # Runs last so the snapshot PR is already open with fresh data. Failing
      # here is what routes a set-but-broken token to notify-failure, instead
      # of letting a run that published nothing report success. A token that
      # is simply absent is a supported workflow_dispatch mode and is left to
      # the warning above.
      - name: Fail run when automation token is unusable
        if: ${{ steps.token_check.outputs.usable != 'true' && env.AUTOMATION_PR_TOKEN != '' }}
        run: |
          echo "::error::AUTOMATION_PR_TOKEN is set but unusable — see the 'Check automation token' step. Today's snapshot is waiting in the automation/update-events PR and needs a manual merge. Rotate the token to restore automatic publishing."
          exit 1

  notify-failure:
    needs: update-events
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      # actions:read lets the notifier name the steps that actually failed.
      actions: read
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Notify pipeline failure
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_NAME: Update Events Daily
          FAILURE_CONTEXT: update-events job (publish-critical path)
          ISSUE_LABEL: pipeline-failure
          ISSUE_LABEL_DESCRIPTION: Backbone outage or publish-path failure requiring operator attention
        run: node scripts/notifyPipelineFailure.mjs

name: Update Events Daily

on:
  schedule:
    # GitHub cron is UTC-only, so run at both 11:00 and 12:00 UTC.
    # schedule-gate maps the triggering cron to the active Pacific offset
    # so delayed runs still execute on the intended local 4:00 AM schedule.
    #
    # Fall cadence (2026-08): daily at 4:00 AM Pacific — campus event volume
    # rises with the semester. Summer was Mon/Wed/Fri only.
    - cron: "0 11 * * *"
    - cron: "0 12 * * *"
  workflow_dispatch:

concurrency:
  group: update-events-main
  cancel-in-progress: false

env:
  AUTOMATION_PR_TOKEN: ${{ secrets.AUTOMATION_PR_TOKEN }}

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  schedule-gate:
    if: ${{ github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.gate.outputs.should_run }}
    steps:
      - name: Gate scheduled runs to 4:00 AM Pacific
        id: gate
        run: |
          trigger_cron='${{ github.event.schedule }}'
          pacific_offset="$(TZ=America/Los_Angeles date +%z)"
          should_run=false

          # Match the cron strings configured above. Update both this case
          # and the cron list together when switching summer/fall cadence.
          case "${pacific_offset}:${trigger_cron}" in
            -0700:"0 11 * * *"|\
            -0800:"0 12 * * *")
              should_run=true
              ;;
          esac

          echo "should_run=${should_run}" >> "$GITHUB_OUTPUT"

          if [ "$should_run" != "true" ]; then
            echo "Skipping scheduled run triggered by '${trigger_cron}' with Pacific offset ${pacific_offset}."
          fi

  update-events:
    needs: schedule-gate
    if: |
      always() && (
        github.event_name == 'workflow_dispatch' ||
        (needs.schedule-gate.result == 'success' && needs.schedule-gate.outputs.should_run == 'true')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Require automation token for scheduled runs
        if: ${{ github.event_name == 'schedule' && env.AUTOMATION_PR_TOKEN == '' }}
        run: |
          echo "::error::AUTOMATION_PR_TOKEN required for scheduled runs — see README"
          exit 1

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate events snapshot
        env:
          STRICT_DATA_QUALITY: "true"
          # Must exceed the longest gap between scheduled runs. Daily cadence
          # leaves ~24h between publishes; 48 leaves headroom for a missed run.
          MAX_FALLBACK_AGE_HOURS: "48"
        run: |
          set -euo pipefail
          for attempt in 1 2; do
            if npm run update-events; then
              exit 0
            fi
            if [ "${attempt}" = "2" ]; then
              echo "::error::update-events failed after 2 attempts"
              exit 1
            fi
            echo "update-events failed (attempt ${attempt}), retrying in 120s..."
            sleep 120
          done

      - name: Check feed health
        env:
          BLOCK_ON_DEGRADED: "true"
          FEED_STALE_HOURS: "36"
          MAX_FALLBACK_AGE_HOURS: "48"
        run: npx tsx scripts/checkFeedHealth.ts

      # Publish-critical validation only. Live corpus golden queries
      # (search-quality) must not block shipping a healthy snapshot — they run
      # afterward and open a low-priority data-quality issue on failure.
      - name: Validate published artifacts
        run: npm run validate

      - name: Corpus search-quality checks
        id: search_quality
        continue-on-error: true
        run: npm run test:search-quality

      - name: Open data-quality issue on corpus regressions
        if: ${{ steps.search_quality.outcome == 'failure' }}
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_NAME: Corpus search quality
          FAILURE_CONTEXT: live golden-query checks against the newly generated feed
          ISSUE_LABEL: data-quality
          ISSUE_LABEL_COLOR: FBCA04
          ISSUE_LABEL_DESCRIPTION: Non-blocking corpus/search quality regression for triage
        run: node scripts/notifyPipelineFailure.mjs

      - name: Create artifact update pull request
        id: create_pr
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ env.AUTOMATION_PR_TOKEN || github.token }}
          branch: automation/update-events
          base: main
          delete-branch: true
          add-paths: |
            public/events.json
            public/search-index.json
            public/status.json
          commit-message: "Update events snapshot"
          title: "Update events snapshot"
          body: |
            ## Summary

            This PR was opened automatically by the daily events pipeline.

            Updated artifacts:

            - `public/events.json`
            - `public/search-index.json`
            - `public/status.json`

            ## Validation

            - `npm run update-events`
            - `npm run validate` (publish-critical; search-quality is non-blocking)
            - Corpus search-quality: `${{ steps.search_quality.outcome }}`

            Workflow run: `${{ github.run_id }}`
          author: github-actions[bot] <github-actions[bot]@users.noreply.github.com>
          committer: github-actions[bot] <github-actions[bot]@users.noreply.github.com>

      - name: Warn if updater PR cannot complete automatically
        if: ${{ steps.create_pr.outputs.pull-request-number && env.AUTOMATION_PR_TOKEN == '' }}
        run: |
          echo "::warning::AUTOMATION_PR_TOKEN is not set."
          echo "::warning::The updater PR was created with GITHUB_TOKEN, so downstream pull_request workflows like browser-e2e will not run and auto-merge is skipped."

      - name: Wait for required checks and merge artifact update PR
        if: ${{ steps.create_pr.outputs.pull-request-number && env.AUTOMATION_PR_TOKEN != '' }}
        # Gate the merge on the data-relevant checks ONLY. The old approach used
        # `gh pr checks --watch --fail-fast`, which failed the whole cron when
        # *any* check went red — including unrelated ones (e.g. a transient
        # security advisory). A daily data refresh must merge whenever the data
        # itself is validated, not when the entire repo posture is perfect.
        env:
          GH_TOKEN: ${{ env.AUTOMATION_PR_TOKEN }}
          # Substring-matched (case-insensitive) against the PR's check names.
          REQUIRED_CHECKS: "validate browser-e2e"
          # Overall budget for required checks to appear and finish.
          CHECK_TIMEOUT_SECONDS: "1200"
          POLL_INTERVAL_SECONDS: "15"
        run: |
          set -euo pipefail
          pr_number="${{ steps.create_pr.outputs.pull-request-number }}"
          deadline=$(( $(date +%s) + CHECK_TIMEOUT_SECONDS ))

          while :; do
            # `gh pr checks --json` prints the JSON array even when its exit code
            # is non-zero (pending/failing), so capture output regardless.
            checks="$(gh pr checks "${pr_number}" --json name,bucket 2>/dev/null || true)"
            checks="${checks:-[]}"

            all_pass=true
            any_fail=false
            for req in ${REQUIRED_CHECKS}; do
              bucket="$(echo "${checks}" | jq -r --arg n "${req}" \
                '[.[] | select((.name | ascii_downcase) | contains($n))] | (.[0].bucket // "missing")')"
              case "${bucket}" in
                pass) ;;
                fail|cancel)
                  any_fail=true
                  echo "::error::Required check '${req}' is ${bucket} on PR #${pr_number}."
                  ;;
                *) all_pass=false ;; # pending, skipping, or not yet registered
              esac
            done

            if [ "${any_fail}" = "true" ]; then
              echo "Required check(s) failed; refusing to merge PR #${pr_number}."
              gh pr checks "${pr_number}" || true
              exit 1
            fi

            if [ "${all_pass}" = "true" ]; then
              echo "All required checks passed for PR #${pr_number}."
              break
            fi

            if [ "$(date +%s)" -ge "${deadline}" ]; then
              echo "::error::Timed out after ${CHECK_TIMEOUT_SECONDS}s waiting for required checks on PR #${pr_number}."
              gh pr checks "${pr_number}" || true
              exit 1
            fi

            sleep "${POLL_INTERVAL_SECONDS}"
          done

          gh pr merge --merge "${pr_number}"

  notify-failure:
    needs: update-events
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Notify pipeline failure
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_NAME: Update Events Daily
          FAILURE_CONTEXT: update-events job (publish-critical path)
          ISSUE_LABEL: pipeline-failure
          ISSUE_LABEL_DESCRIPTION: Backbone outage or publish-path failure requiring operator attention
        run: node scripts/notifyPipelineFailure.mjs

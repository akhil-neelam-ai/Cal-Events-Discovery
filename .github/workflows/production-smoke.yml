name: Production Smoke Test

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-smoke-main
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Verify production artifacts
        env:
          PRODUCTION_URL: https://cal-events.com
          # Daily cadence: publishes should land ~every 24h. 36h covers one
          # missed run plus Vercel deploy latency.
          MAX_STATUS_AGE_HOURS: "36"
          # Retry to absorb the Vercel deploy race. Push-to-main triggers both
          # this smoke test and the production deploy concurrently, and a
          # fresh fetch can see the previous build's status.json for up to
          # ~2 minutes before the new artifacts go live.
          MAX_RETRIES: "6"
          RETRY_SLEEP_SECONDS: "30"
        run: |
          set -euo pipefail

          echo "Checking ${PRODUCTION_URL}"

          curl -fsS "${PRODUCTION_URL}/" -o /dev/null
          curl -fsS "${PRODUCTION_URL}/events.json" | jq -e '.events | length > 0'
          curl -fsS "${PRODUCTION_URL}/status.json" | jq -e '.generated_at and (.total_events | tonumber) > 0'

          age_hours=""
          for attempt in $(seq 1 "${MAX_RETRIES}"); do
            generated_at="$(curl -fsS "${PRODUCTION_URL}/status.json" | jq -r '.generated_at')"
            generated_epoch="$(date -u -d "${generated_at}" +%s)"
            now_epoch="$(date -u +%s)"
            age_hours="$(( (now_epoch - generated_epoch) / 3600 ))"

            echo "Attempt ${attempt}/${MAX_RETRIES}: production status age ${age_hours}h (threshold ${MAX_STATUS_AGE_HOURS}h)"
            if [ "${age_hours}" -le "${MAX_STATUS_AGE_HOURS}" ]; then
              echo "Production smoke test passed (attempt ${attempt}, age ${age_hours}h)"
              exit 0
            fi

            if [ "${attempt}" -lt "${MAX_RETRIES}" ]; then
              echo "Waiting ${RETRY_SLEEP_SECONDS}s for Vercel deploy to land..."
              sleep "${RETRY_SLEEP_SECONDS}"
            fi
          done

          echo "::error::Production status.json still ${age_hours}h old after ${MAX_RETRIES} attempts (threshold ${MAX_STATUS_AGE_HOURS}h)"
          exit 1

  notify-failure:
    needs: smoke
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Notify production smoke failure
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_NAME: Production Smoke Test
          FAILURE_CONTEXT: live production feed stale or unreachable
          ISSUE_LABEL: pipeline-failure
          ISSUE_LABEL_DESCRIPTION: Stale or unreachable production feed requiring operator attention
        run: node scripts/notifyPipelineFailure.mjs

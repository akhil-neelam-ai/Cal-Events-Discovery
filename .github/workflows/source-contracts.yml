name: Source Contracts

on:
  schedule:
    - cron: "0 17 * * 1"
  pull_request:
    paths:
      - "scripts/sources/**"
      - "scripts/lib/fetchWithRetry.ts"
      - "scripts/lib/sourceContracts.mjs"
      - "scripts/runSourceContracts.mjs"
      - "scripts/checkLiveWhaleBudget.ts"
      - "scripts/lib/abort.ts"
      - "scripts/lib/normalize.ts"
  workflow_dispatch:

# Only the notify job writes issues, and it grants that itself.
permissions:
  contents: read

jobs:
  source-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      has_failures: ${{ steps.contracts.outputs.has_failures }}
      failed_sources: ${{ steps.contracts.outputs.failed_sources }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run live source contract checks
        id: contracts
        run: node scripts/runSourceContracts.mjs

  # LiveWhale fetches nine windows plus 70 group feeds inside a 90 s budget.
  # This simulates a uniformly slow events.berkeley.edu (14 s per request) and
  # fails if the adapter overruns or loses a required window.
  livewhale-budget:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check the LiveWhale time budget under a slow upstream
        run: npm run check:livewhale-budget

  # Runs when the check fails outright (critical source down) AND when it passes
  # with supplementary failures, so a dead secondary source still raises an issue
  # instead of disappearing into a green run.
  notify-failure:
    needs: [source-contracts, livewhale-budget]
    if: |
      always() && (
        failure() ||
        needs.source-contracts.outputs.has_failures == 'true'
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Notify contract failure
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_NAME: Source Contracts
          FAILURE_CONTEXT:
            "live Berkeley source contract checks (failed sources:
            ${{ needs.source-contracts.outputs.failed_sources || 'none' }};
            LiveWhale slow-upstream budget check:
            ${{ needs.livewhale-budget.result }})"
          ISSUE_LABEL: source-contracts
          ISSUE_LABEL_COLOR: 0E8A16
          ISSUE_LABEL_DESCRIPTION: Non-urgent live source contract drift for triage
        run: node scripts/notifyPipelineFailure.mjs

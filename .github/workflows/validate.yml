name: Validate

on:
  push:
    branches:
      - main
    paths-ignore:
      - "public/events.json"
      - "public/search-index.json"
      - "public/status.json"
  pull_request:
  workflow_dispatch:

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Dependency auditing intentionally lives in the standalone
      # `security-audit` workflow, not here. A new upstream CVE must never block
      # the daily data-update PR from merging; security findings surface as a
      # tracked issue on their own cadence instead.

      - name: Enforce published-artifact size budgets
        env:
          # Current sizes are ~576 KB events.json and ~232 KB search-index.json.
          # The budget is generous (~7x headroom) so seasonal growth is fine,
          # but catches a regression where one source starts including base64
          # PDFs or rich HTML in descriptions and balloons the committed file
          # past the frontend's 8s parse timeout.
          MAX_EVENTS_JSON_BYTES: "4194304" # 4 MiB
          MAX_SEARCH_INDEX_BYTES: "2097152" # 2 MiB
        run: |
          set -euo pipefail
          for entry in \
            "public/events.json:${MAX_EVENTS_JSON_BYTES}" \
            "public/search-index.json:${MAX_SEARCH_INDEX_BYTES}"; do
            path="${entry%:*}"
            budget="${entry##*:}"
            if [ ! -f "${path}" ]; then
              echo "::warning::${path} not present in this checkout, skipping size check"
              continue
            fi
            size=$(stat -c %s "${path}" 2>/dev/null || stat -f %z "${path}")
            echo "${path}: ${size} bytes (budget ${budget})"
            if [ "${size}" -gt "${budget}" ]; then
              echo "::error::${path} is ${size} bytes, exceeding the ${budget}-byte budget. A source is likely bloating its description payload — check the latest update-events output for the largest contributors."
              exit 1
            fi
          done

      - name: Run validation suite
        run: npm run validate

  # Non-blocking on purpose: corpus golden queries can fail when real campus
  # content changes without any code bug. Required merge gates stay `validate`
  # + `browser-e2e` on the automation PR. Daily cron opens a data-quality issue
  # when this suite fails against a fresh snapshot.
  search-quality:
    needs: validate
    if: ${{ always() && needs.validate.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run corpus search-quality suite
        run: npm run test:search-quality

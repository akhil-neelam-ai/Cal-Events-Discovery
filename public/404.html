<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page not found | CalEvents</title>
    <meta name="robots" content="noindex" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link
      rel="preload"
      href="/fonts/archivo-v25-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="stylesheet" href="/site-pages.css" />
  </head>
  <body>
    <header class="masthead">
      <div class="wrap">
        <a class="wordmark" href="/" aria-label="CalEvents home"
          ><b>Cal</b><span>Events</span></a
        >
        <nav class="site-nav" aria-label="Site">
          <a href="/">Events</a>
          <a href="/about.html">About</a>
          <a href="/privacy.html">Privacy</a>
        </nav>
      </div>
    </header>

    <main>
      <div class="wrap lost">
        <!-- What is left of a flyer someone tore off the wall -->
        <div class="torn" aria-hidden="true"><span>404</span></div>

        <article class="page">
          <h1>This page isn't here</h1>
          <p class="lead">
            The address may be mistyped, or the page may have moved. The events
            are all still on the home page.
          </p>

          <form class="search" action="/" method="get" role="search">
            <label for="q">Search campus events</label>
            <input
              id="q"
              name="q"
              type="search"
              placeholder="Speaker, topic or venue"
              autocomplete="off"
            />
            <button class="btn-line" type="submit">Search events</button>
          </form>

          <div class="sheet-foot">
            <a class="btn-toner" href="/">See this week's events</a>
          </div>
        </article>
      </div>
    </main>

    <footer class="site-footer">
      <div class="wrap">
        <p>CalEvents is an independent student project.</p>
        <nav aria-label="Footer">
          <a href="/">Events</a>
          <a href="/about.html">About</a>
          <a href="/privacy.html">Privacy</a>
        </nav>
      </div>
    </footer>
  </body>
</html>

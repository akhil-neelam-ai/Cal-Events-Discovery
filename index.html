<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CalEvents - Discover UC Berkeley Campus Events</title>

    <!-- SEO Meta Tags -->
    <meta
      name="description"
      content="Discover upcoming UC Berkeley events. Find lectures, performances, sports games, workshops, and more across all campus schools and departments. Updated daily."
    />
    <meta
      name="keywords"
      content="UC Berkeley events, Cal events, Berkeley campus events, Berkeley lectures, Cal Bears games, Berkeley performances, Berkeley workshops"
    />
    <meta name="author" content="Akhil Neelam" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://cal-events.com/" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link
      rel="alternate"
      type="text/markdown"
      href="/llms.txt"
      title="CalEvents agent overview"
    />
    <link
      rel="service-desc"
      type="application/vnd.oai.openapi+json"
      href="/openapi.json"
    />
    <link
      rel="api-catalog"
      type="application/linkset+json"
      href="/.well-known/api-catalog"
    />
    <link
      rel="describedby"
      type="application/json"
      href="/.well-known/agent-skills/index.json"
    />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://cal-events.com/" />
    <meta
      property="og:title"
      content="CalEvents - Discover UC Berkeley Campus Events"
    />
    <meta
      property="og:description"
      content="Find lectures, performances, sports games, workshops, and more across all Berkeley campus schools. Updated daily."
    />
    <meta property="og:image" content="https://cal-events.com/og-image.png" />
    <meta property="og:site_name" content="CalEvents" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://cal-events.com/" />
    <meta
      name="twitter:title"
      content="CalEvents - Discover UC Berkeley Campus Events"
    />
    <meta
      name="twitter:description"
      content="Find lectures, performances, sports games, workshops, and more across all Berkeley campus schools. Updated daily."
    />
    <meta name="twitter:image" content="https://cal-events.com/og-image.png" />

    <!-- Google Analytics 4 — config() is called from utils/analytics.ts with send_page_view: false -->
    <script
      async
      src="https://www.googletagmanager.com/gtag/js?id=G-E8MCW83PNG"
    ></script>
    <script src="/gtag-init.js"></script>

    <link
      rel="preload"
      href="/fonts/archivo-v25-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <!-- Structured data: site name and search URL for search engines -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "@id": "https://cal-events.com/#website",
        "name": "CalEvents",
        "url": "https://cal-events.com/",
        "description": "UC Berkeley campus events in one searchable feed, updated every morning.",
        "inLanguage": "en",
        "publisher": {
          "@type": "Person",
          "@id": "https://akhilneelam.com/#person",
          "name": "Akhil Neelam",
          "url": "https://akhilneelam.com/"
        },
        "potentialAction": {
          "@type": "SearchAction",
          "target": {
            "@type": "EntryPoint",
            "urlTemplate": "https://cal-events.com/?q={search_term_string}"
          },
          "query-input": "required name=search_term_string"
        }
      }
    </script>

    <!-- Styles for the fallback inside #root. It shows until the app loads,
         and is all that readers without JavaScript see. -->
    <style>
      /* The same blue wall and white notice the app draws, so the swap on
         load does not flash a different look. */
      body {
        margin: 0;
        background: #003262;
      }
      .boot {
        box-sizing: border-box;
        min-height: 100vh;
        padding: 1.25rem 16px 3rem;
        background: #003262;
        color: #121212;
        font-family: "Archivo", "Arial Narrow", "Helvetica Neue", Arial,
          sans-serif;
      }
      .boot-sheet {
        box-sizing: border-box;
        max-width: 34rem;
        padding: 1rem 1rem 1.25rem;
        background: #fcfcf9;
        transform: rotate(-0.5deg);
      }
      .boot-mark {
        font-weight: 900;
        font-stretch: 118%;
        font-size: clamp(2.9rem, 15.5vw, 4.4rem);
        line-height: 0.84;
        letter-spacing: -0.035em;
      }
      .boot-mark span {
        display: block;
      }
      .boot h1 {
        margin: 0.8rem 0 0;
        font-weight: 800;
        font-stretch: 78%;
        font-size: 1.5rem;
        line-height: 1.05;
      }
      .boot p {
        max-width: 60ch;
        margin: 0.6rem 0 0;
        font-weight: 500;
        font-stretch: 92%;
        font-size: 1rem;
        line-height: 1.35;
      }
      .boot nav {
        display: flex;
        flex-wrap: wrap;
        gap: 0.25rem 1.25rem;
        margin: 1rem -1rem 0;
        padding: 0.6rem 1rem 0;
        border-top: 2px dashed #121212;
        font-weight: 700;
        font-stretch: 88%;
      }
      .boot a {
        color: #121212;
        text-decoration-thickness: 2px;
        text-underline-offset: 4px;
      }
      .boot nav a {
        display: inline-block;
        padding: 0.6rem 0;
      }
      .boot a:focus-visible {
        outline: 3px solid #121212;
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <main class="boot">
        <div class="boot-sheet">
          <div class="boot-mark"><span>Cal</span><span>Events</span></div>
          <h1>UC Berkeley events in one searchable feed</h1>
          <p>
            CalEvents gathers lectures, performances, games and student events
            from campus calendars, and updates every morning.
          </p>
          <noscript>
            <p>
              The live feed needs JavaScript. Turn it on, or read the events
              as <a href="/events.json">JSON</a>.
            </p>
          </noscript>
          <nav aria-label="Site">
            <a href="/about.html">About</a>
            <a href="/privacy.html">Privacy</a>
            <a href="/for-agents.html">For agents</a>
          </nav>
        </div>
      </main>
    </div>
    <script src="/webmcp-tools.js" defer></script>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
